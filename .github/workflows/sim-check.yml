# Builds and tests one game on GitHub's Mac runner, so this old Mac never compiles. scripts/ci/remote-check.sh starts it by
# pushing a wrapper commit to ci/<label>; the game and the steps are in that commit's message. Results go to the branch
# ci-results/<label>.
name: Sim check
on:
  push:
    branches: ['ci/**']
permissions:
  contents: write
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run the steps
        env:
          # The App Store Connect API key for run-check.sh's testflight step. Only rounds on ci/tf-* branches get it;
          # forks never do. The values never go into ci-out (see testflight in run-check.sh).
          ASC_KEY_ID: ${{ startsWith(github.ref_name, 'ci/tf-') && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ startsWith(github.ref_name, 'ci/tf-') && secrets.ASC_ISSUER_ID || '' }}
          ASC_PRIVATE_KEY: ${{ startsWith(github.ref_name, 'ci/tf-') && secrets.ASC_PRIVATE_KEY || '' }}
        run: scripts/ci/run-check.sh
      - name: Publish the results
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/publish-results.sh
