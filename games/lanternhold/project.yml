# Lanternhold: a side-view pixel-art kingdom in a gorge (DESIGN.md). Built only on GitHub's Mac runner
# (scripts/ci/remote-check.sh lanternhold lh-<label> ...); a round with Metal starts with the Metal Toolchain guard step.
# Pattern: games/hello/project.yml.
name: Lanternhold
options:
  bundleIdPrefix: com.louisherwick
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    # SwiftUI (iOS 26) builds some views on its own render thread; Swift 6's main-actor check in every view closure traps
    # there (Piston Empire crashes 03.10.). The views are plain values SwiftUI may build anywhere: no check.
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-dynamic-actor-isolation"
    DEVELOPMENT_TEAM: XLKZ9W7C7T
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ALWAYS_SEARCH_USER_PATHS: NO

# --- Ads: Google Mobile Ads + the consent form (UMP) through Swift Package Manager (as Comet Cargo and Piston Empire) ----
# Pinned by Package.resolved (the runner copies it into the generated project).
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.11.0"
  # Comes with GoogleMobileAds anyway; named here so the app may import it (the consent form, `Ads/AdConsent`).
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: "3.1.0"
# --- end ads ------------------------------------------------------------------------------------------------------------

targets:
  Lanternhold:
    type: application
    platform: iOS
    # Resources includes Resources/Art/*.png (the art agent's pixel art) when the folder exists: plain resources,
    # copied byte for byte (no PNG crushing), found by AtlasBuilder.artURL; a missing or sparse folder still builds.
    sources:
      - App
      - Core
      - Render
      - UI
      - Ads
      - Resources
    settings:
      base:
        COMPRESS_PNG_FILES: NO
        STRIP_PNG_TEXT: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.louisherwick.lanternhold
        PRODUCT_NAME: Lanternhold
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Resources/Assets.xcassets: the 1024 pt icon (the lit castle gate at night, from the art pass), single size.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The interface's typeface (IM Fell English, SIL OFL; Resources/Fonts): Xcode merges this file's UIAppFonts into
        # the generated plist (docs/UI-look.md). It sits outside the source folders so it is not copied as a resource.
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Lanternhold
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.strategy-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # --- Ads ------------------------------------------------------------------------------------------------------
        # Louis' AdMob app id, HERE only (Info.plist reads it as GADApplicationIdentifier). One value for every
        # configuration: the ad unit ids in Ads/AdConfig.swift decide test (Debug) or live (Release).
        GAD_APPLICATION_IDENTIFIER: ca-app-pub-4855617456569312~7252229972
        # The tracking question's text; Resources/InfoPlist.xcstrings holds it in all eight languages.
        INFOPLIST_KEY_NSUserTrackingUsageDescription: "Lets the few ads you see match your interests. The game plays the same either way."
        # --- end ads --------------------------------------------------------------------------------------------------
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - sdk: StoreKit.framework
      - sdk: AppTrackingTransparency.framework

  LanternholdTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Lanternhold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louisherwick.lanternhold.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lanternhold.app/Lanternhold"
        BUNDLE_LOADER: "$(TEST_HOST)"

  LanternholdUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Lanternhold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louisherwick.lanternhold.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lanternhold

schemes:
  Lanternhold:
    build:
      targets:
        Lanternhold: all
        LanternholdTests: [test]
        LanternholdUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      language: en
      region: US
      targets:
        - LanternholdTests
        - LanternholdUITests
    archive:
      config: Release
