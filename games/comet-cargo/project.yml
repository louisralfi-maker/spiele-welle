# Comet Cargo: launch a cargo rocket, drop each stage on time, release every satellite inside a glowing orbit ring.
# Built only on GitHub's Mac runner (scripts/ci/remote-check.sh comet-cargo ...). Pattern: games/hello/project.yml.
name: CometCargo
options:
  bundleIdPrefix: com.louisherwick
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    # SwiftUI (iOS 26) builds some views on its own render thread; Swift 6's main-actor check in every view closure traps
    # there (Piston Empire crashes 03.10.). The views are plain values SwiftUI may build anywhere: no check.
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-dynamic-actor-isolation"
    DEVELOPMENT_TEAM: XLKZ9W7C7T
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ALWAYS_SEARCH_USER_PATHS: NO

# --- Ads: Google Mobile Ads + the consent form (UMP) through Swift Package Manager (as Piston Empire) -------------------
# Pinned by Package.resolved (the runner copies it into the generated project).
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.11.0"
  # Comes with GoogleMobileAds anyway; named here so the app may import it (the consent form, `AdConsent`).
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: "3.1.0"
# --- end ads ------------------------------------------------------------------------------------------------------------

targets:
  CometCargo:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - UI
      - Audio
      - Ads
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louisherwick.cometcargo
        PRODUCT_NAME: CometCargo
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # GADApplicationIdentifier and Google's SKAdNetwork list: Xcode merges this file into the generated plist.
        INFOPLIST_FILE: Resources/LaunchInfo.plist
        INFOPLIST_KEY_CFBundleDisplayName: Comet Cargo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.casual-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # --- Ads ------------------------------------------------------------------------------------------------------
        # Louis' AdMob app id, HERE only (Resources/LaunchInfo.plist reads it as GADApplicationIdentifier). One value for
        # every configuration: the ad unit ids in Ads/AdConfig.swift decide test (Debug) vs live (Release).
        GAD_APPLICATION_IDENTIFIER: ca-app-pub-4855617456569312~2107555400
        INFOPLIST_KEY_NSUserTrackingUsageDescription: "Lets the few ads you see match your interests. The game plays the same either way."
        # --- end ads --------------------------------------------------------------------------------------------------
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - sdk: StoreKit.framework
      - sdk: AppTrackingTransparency.framework

  CometCargoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: CometCargo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louisherwick.cometcargo.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CometCargo.app/CometCargo"
        BUNDLE_LOADER: "$(TEST_HOST)"

  CometCargoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: CometCargo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louisherwick.cometcargo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CometCargo

schemes:
  CometCargo:
    build:
      targets:
        CometCargo: all
        CometCargoTests: [test]
        CometCargoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      language: en
      region: US
      targets:
        - CometCargoTests
        - CometCargoUITests
    archive:
      config: Release
