# The runner canary: the smallest app with every part a game has (logic, a String Catalog, unit and UI tests, Release
# build). It proves the round trip to GitHub's Mac and is the pattern a new game's project.yml starts from. Never shipped.
name: Hello
options:
  bundleIdPrefix: com.louisherwick
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    # SwiftUI (iOS 26) builds some views on its own render thread; Swift 6's main-actor check in every view closure traps
    # there (Piston Empire crashes 03.10.). The views are plain values SwiftUI may build anywhere: no check.
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-dynamic-actor-isolation"
    DEVELOPMENT_TEAM: XLKZ9W7C7T
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  Hello:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louisherwick.hello
        PRODUCT_NAME: Hello
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hello
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  HelloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Hello
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louisherwick.hello.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hello.app/Hello"
        BUNDLE_LOADER: "$(TEST_HOST)"

  HelloUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Hello
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louisherwick.hello.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Hello

schemes:
  Hello:
    build:
      targets:
        Hello: all
        HelloTests: [test]
        HelloUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      language: en
      region: US
      targets:
        - HelloTests
        - HelloUITests
    archive:
      config: Release
